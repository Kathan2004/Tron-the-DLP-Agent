name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: System packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Extension detectors are generated from the Python library
        run: python scripts/build_extension_detectors.py --check
      - name: Tests (detection, extraction, rules engine, API, extension parity)
        run: python -m pytest -q
      - name: Detection benchmark
        run: python scripts/benchmark_detection.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem-console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: siem-console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Manifest and script syntax
        run: |
          node -e 'const m=require("./browser-extension/manifest.json"); const fs=require("fs");
            const files=[m.background.service_worker, ...m.content_scripts.flatMap(c=>[...c.js,...(c.css||[])]), ...Object.values(m.icons)];
            for (const f of files) { if (!fs.existsSync("browser-extension/"+f)) { console.error("missing", f); process.exit(1) } }
            console.log("manifest ok")'
          for f in browser-extension/*.js browser-extension/popup/*.js; do node --check "$f"; done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set gitleaks base ref
        run: |
          if git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            echo "BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
