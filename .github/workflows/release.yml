name: Release

# Tag vX.Y.Z to publish the browser extension build and checksums as a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Detectors match the Python library
        run: |
          pip install -r requirements.txt
          python scripts/build_extension_detectors.py --check
      - name: Tag matches the extension version
        run: |
          version=$(python -c 'import json; print(json.load(open("browser-extension/manifest.json"))["version"])')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "manifest version ${version} != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Package
        run: |
          cd browser-extension
          zip -r -X "../tron-dlp-extension-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'
          cd ..
          sha256sum "tron-dlp-extension-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "tron-dlp-extension-${GITHUB_REF_NAME}.zip" SHA256SUMS \
            --title "Tron DLP ${GITHUB_REF_NAME}" --generate-notes
