# Tron DLP: API + console. For TLS add `--profile tls` and set TRON_DOMAIN (docs/deployment.md).
services:
  tron-api:
    build: .
    env_file: .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5001"
      DEBUG: "False"
      # Two proxy hops in front of the API in the tls profile (Caddy -> nginx), one otherwise.
      TRON_TRUSTED_PROXIES: ${TRON_TRUSTED_PROXIES:-1}
    volumes:
      - tron-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Not published: reachable only through the console's reverse proxy.
    expose:
      - "5001"

  console:
    build: ./siem-console
    depends_on:
      tron-api:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback only. Expose it through the tls profile or your own reverse proxy.
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    depends_on: [console]
    restart: unless-stopped
    environment:
      TRON_DOMAIN: ${TRON_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tron-data:
  caddy-data:
  caddy-config:
